# DocsRAG nginx reverse proxy configuration.
#
# This file matches docs/hetzner_deployment_plan.md.
# Replace the example domain names before installation.

server {
    listen 80;
    server_name your-domain.example www.your-domain.example;

    # Keep request sizes conservative for the current chat API.
    client_max_body_size 1m;

    # ACME challenge path used by certbot / Let's Encrypt.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Proxy the frontend preview server.
    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy /api/* to the backend while stripping the /api/ prefix.
    # Example: /api/chat -> /chat
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Longer timeouts help for streamed and slower chat responses.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Disable proxy buffering to keep SSE/chat streaming responsive.
        proxy_buffering off;
    }
}
